version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: patient_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: patient_db
      MYSQL_USER: patient_app
      MYSQL_PASSWORD: patient_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://patient_app:patient_password@mysql:3306/patient_db
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: patient-images-bucket
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patient_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mysql_data:

networks:
  default:
    name: patient_network
